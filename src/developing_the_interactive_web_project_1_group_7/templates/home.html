<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixtape</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/pure-min.css" integrity="sha384-kj0X2NG2KHBie8Tq8fH1kxnyWM9XsXQpq7XdwbKmFKjwwaXGKBlB2Klu3VOltSFx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/grids-responsive-min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mixtape_template.css') }}">
</head>
<body>
    {% include "header.html" %}
    <h2>Browse mixtapes</h2>
    <div class="filters">
        <ul> 
            <li><button class="pure-button selected">recent</button></li>
            <li><button class="pure-button">popular</button></li>
        </ul>
        <ul>
            <li><button class="pure-button">late-night</button></li>
            <li><button class="pure-button">morning</button></li>
            <li><button class="pure-button">pop</button></li>
            <li><button class="pure-button">alternative</button></li>
            <li><button class="pure-button">study</button></li>
        </ul>
    </div>

    <div class="mixtapes">
        <div class="pure-g">
            <!-- In the future we can change so its i in range(#), I just chose 9 as filler for now-->
            {% for i in range(9) %}
                <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                    {% include "mixtape_template.html" %}
                </div>
            {% endfor %}
        </div>
    </div>
    <!-- {% for mixtape in mixtapes %}
        {% include "mixtape_template.html" %}
    {% endfor %} -->

</body>

</html>
