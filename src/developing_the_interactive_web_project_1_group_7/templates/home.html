{% extends "base.html" %}

{% block title %}Homepage{% endblock %}

{% block content %}
<section>

    <h2>Browse mixtapes</h2>
    <div class="filters">
        <ul> 
            <li><button class="pure-button selected">recent</button></li>
            <li><button class="pure-button">popular</button></li>
        </ul>
        <ul>
            <li><button class="pure-button">late-night</button></li>
            <li><button class="pure-button">morning</button></li>
            <li><button class="pure-button">sleepy</button></li>
            <li><button class="pure-button">chill</button></li>
            <li><button class="pure-button">pop</button></li>
            <li><button class="pure-button">alternative</button></li>
            <li><button class="pure-button">heartbreak</button></li>
            <li><button class="pure-button">study</button></li>
            <li><button class="pure-button">driving</button></li>
            <li><button class="pure-button">workout</button></li>
            <li><button class="pure-button">party</button></li>
            <li><button class="pure-button">getting-ready</button></li>
        </ul>
    </div>

    <div class="mixtapes">
        <div class="pure-g">
            <!-- In the future we can change so its i in range(#), I just chose 9 as filler for now-->
            {% for i in range(16) %}
                <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-4">
                    {% include "mixtape_template.html" %}
                </div>
            {% endfor %}
        </div>
    </div>
    <!-- {% for mixtape in mixtapes %}
        {% include "mixtape_template.html" %}
    {% endfor %} -->

</section>


{% endblock %}
