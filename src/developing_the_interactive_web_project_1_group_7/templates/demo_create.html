{% extends "base.html" %}

{% block content %}

<section style="padding: 30px;">
    <h2>Backend CREATE Testing</h2>

    <form method="POST">
        <input
            type="text"
            name="title"
            placeholder="Mixtape title"
            maxlength="150"
            required
        >

        <input
            type="text"
            name="description"
            placeholder="Description"
        >

        <button type="submit">Save Mixtape</button>
    </form>

    <h3>My Saved Mixtapes</h3>

    {% for mixtape in mixtapes %}
        <p>
            {{ mixtape[1] }} —
            {{ mixtape[2] or "" }}
        </p>
    {% else %}
        <p>No mixtapes created yet.</p>
    {% endfor %}
</section>

{% endblock %}
