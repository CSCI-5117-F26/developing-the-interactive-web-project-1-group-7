{% extends "base.html" %}

{% block title %}Search{% endblock %}

{% block content %}

<style>

.search-card {
  background-color: #FDF8F7;
  color: black;
  border-radius: 8px;
  padding: 20px;
  margin-top: 4px;
  max-height: 70vh;
  overflow-y: auto;
}

</style>
<section>

  <div class="pure-g">
<div class="pure-u-4-24">

  </div>
  <div class="pure-u-16-24">
<div class="search-card">
<h3 style="color: black;">Showing results for "{{ query }}"</h3>

    {% for mixtape in results %}
    <div class="pure-g" style="background-color: #E6E6E6; margin-bottom: 10px;">
        <div class="pure-u-5-24">
            <div style="background-color: grey; border-radius: 15px; margin: 10px; width: 90px; height: 90px;"> 
                <div style="height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;">
                    <img src="/static/images/mixtape-cover.png" alt="mixtape cover" style="width: 85%;">
                </div>
            </div>
        </div>
        <div class="pure-u-17-24">
            <div>
                <h3 style="color: black;">Mixtape Title</h3>
                <div class="pure-g">
                    <div class="pure-u-1-3" style="color: black;"><span>by Jim Doe</span></div>
                    <div class="pure-u-1-3" style="color: black;"><span>22 Tracks</span></div>
                    <div class="pure-u-1-3" style="color: black;"><span>10 Saved</span></div>
                </div>
                <p style="color: black;">Desc</p>
            </div>
        </div>

    </div>
    {% else %}
    <p style="color: black;">No mixtapes found.</p>
    {% endfor %}
</div>
  </div>
  <div class="pure-u-4-24">

  </div>
  </div>

</section>

{% endblock %}
