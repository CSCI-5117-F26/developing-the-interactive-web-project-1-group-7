<header>
    <nav class="pure-g">

        <!-- Logo -->
        <h1 class="pure-u-1 pure-u-lg-1-5">
            <a  href="{{ url_for('home') }}" style="color: white; background: none; border: none; color: white; text-decoration: none;"><span>M</span><span>i</span><span>x</span>tape</a>
        </h1>

        <!-- Search bar -->
        <form class="pure-u-1 pure-u-lg-3-5">
            <input type="search" placeholder="Search mixtape...">
        </form>

        <!-- Navigation -->
        <div class="pure-u-1 pure-u-lg-1-5">

            {% if session.get("user") %}

                <!-- Logged-in user -->
                <a href="{{ url_for('create') }}" class="add">
                    Add Mixtape
                </a>

                <a href="{{ url_for('profile') }}"
                   class="profile"
                   aria-label="Profile">
                    <i class="fa-solid fa-circle-user"></i>
                </a>

            {% else %}

                <!-- Guest -->
                <a href="{{ url_for('signup') }}" class="signup">
                    Sign up
                </a>

                <a href="{{ url_for('login') }}" class="login">
                    Log In
                </a>

            {% endif %}

        </div>

    </nav>
</header>
