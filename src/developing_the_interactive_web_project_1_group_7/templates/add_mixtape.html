{% extends "base.html" %}

{% block title %}Add Mixtape{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='edit_mixtape.css') }}">

<section>

<form class="pure-form" id="mixtape-form" method="POST" action="{{ url_for('create') }}">

    <div class="profile-info">
        <div class="card" id="mixtape-cover">
            <img id="mixtape-cover-img" src="/static/images/mixtape-cover.png" alt="mixtape cover" width="200">
        </div>

        <div>
            <input type="text" name="title" class="mixtape-title-2" placeholder="Mixtape Title" maxlength="150" required>

            <div class="actions">
                <p class="mixtape-owner">{{ name }}</p>

            <div class="filters">
                <ul>
                    <li><button type="button" class="pure-button" command="show-modal" commandfor="add-description"><i class="fa-regular fa-pen-to-square"></i> <span id="description-button-label">Add Description</span></button></li>
                    <li><button type="button" class="pure-button" command="show-modal" commandfor="add-tag"><i class="fa-solid fa-plus"></i> <span id="tag-button-label">Add tag</span></button></li>
                </ul>
            </div>
            </div>

            <!-- Live preview of the description and tags chosen in the dialogs -->
             <!-- Needs  polish -->
            <p id="description-preview" class="mixtape-desc description-preview" hidden></p>
            <div class="filters tag-preview">
                <ul id="tag-preview"></ul>
            </div>
        </div>
    </div>

    <dialog id="add-description">
        <h4>Add a description</h4>
        <textarea name="description" class="pure-input-1" rows="4" placeholder="What's this mixtape about?"></textarea>
        <div class="dialog-buttons">
            <button type="button" class="pure-button" commandfor="add-description" command="close">Done</button>
        </div>
    </dialog>

    <dialog id="add-tag">
        <h4>Add tags</h4>
        {% for tag in mixtape_tags %}
        <label for="tag-{{ tag }}" class="pure-checkbox">
            <input id="tag-{{ tag }}" type="checkbox" name="tags" value="{{ tag }}"> {{ tag }}
        </label>
        {% endfor %}
        <div class="dialog-buttons">
            <button type="button" class="pure-button" commandfor="add-tag" command="close">Done</button>
        </div>
    </dialog>

    <!-- Songs added from the search below. Each row carries hidden track_ids /
         annotations inputs, so the DOM order is the order saved to the database. -->
    <div class="selected-songs-wrapper">
        <p id="no-songs" class="empty-songs">No songs yet. Search Spotify below and click Add.</p>
        <div id="selected-songs"></div>
    </div>

</form>

<template id="selected-song-template">
    <div class="pure-g song selected-song">
        <input type="hidden" name="track_ids">
        <div class="pure-u-2-24">
            <button type="button" class="icon-button remove-song" aria-label="Remove song"><i class="fa-solid fa-minus"></i></button>
        </div>
        <div class="pure-u-4-24">
            <img class="song-img" alt="">
        </div>
        <div class="pure-u-12-24">
            <h5 class="song-title"></h5>
            <div class="song-meta">
                <p class="song-artist"></p>
                <p class="song-album"></p>
            </div>
        </div>
        <div class="pure-u-2-24">
            <p class="song-duration"></p>
        </div>
        <div class="pure-u-2-24">
            <i class="fa-solid fa-bars drag-handle" aria-label="Drag to reorder"></i>
        </div>

        <div class="pure-u-6-24"></div>
        <div class="pure-u-18-24">
            <input type="text" name="annotations" class="song-note-input" maxlength="300" placeholder="Add a note about why this song is here (optional)">
        </div>
    </div>
</template>

<template id="search-result-template">
    <div class="pure-g song">
        <div class="pure-u-4-24">
            <img class="song-img" alt="">
        </div>
        <div class="pure-u-16-24">
            <h5 class="song-title"></h5>
            <div class="song-meta">
                <p class="song-artist"></p>
                <p class="song-album"></p>
            </div>
        </div>
        <div class="pure-u-4-24">
            <button type="button" class="pure-button login add-song">Add</button>
        </div>
    </div>
</template>

<h2>Find the songs from Spotify</h2>

<div style="padding: 0 50px;">
    <form class="pure-form" id="song-search" action="{{ url_for('search_spotify_tracks') }}" method="GET">
        <input id="q" name="q" type="text" required maxlength="100" placeholder="Search song..."/>
        <button type="submit" class="pure-button login">Search</button>
    </form>

    <p id="search-status" class="search-status" aria-live="polite"></p>
    <div id="search-results"></div>
</div>

<div style="text-align: right; padding: 20px 50px;">
    <button type="submit" form="mixtape-form" class="pure-button login">Save</button>
</div>

</section>

<link rel="stylesheet" href="{{ url_for('static', filename='songs.css') }}">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="{{ url_for('static', filename='add_mixtape.js') }}"></script>

{% endblock %}
