
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='songs.css') }}">
<section>

<div class="pure-g song">
    <div class="pure-u-2-24">
        <i class="fa-solid fa-minus"></i>
    </div>
    <div class="pure-u-4-24">
        <img class="song-img" src="" alt="Song's Cover Image">
    </div>
    <div class="pure-u-12-24">
        <h5>Song Title</h5>
        <div class="song-meta">
            <p>Artist</p>
            <p>Album</p>
        </div>
    </div>
    <div class="pure-u-2-24">
        <p>3:21</p>
    </div>
    <div class="pure-u-2-24">
        <i class="fa-solid fa-bars"></i>
    </div>

    <div class="pure-u-6-24"></div>
    <div class="pure-u-18-24">
        <p class="song-note">Song description</p>
    </div>
</div>
</section>

{% endblock %}
